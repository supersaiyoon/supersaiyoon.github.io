<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PokéSearch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>PokéSearch</h1>
        <p class="caption">Search for a Pokémon by name or Pokédex number.</p>
    </header>

    <main class="container">
        <section class="search-section">
            <div class="input-group">
                <input
                    type="text"
                    id="userInput"
                    list="pokemonList"
                    placeholder="Example: Squirtle or 103"
                    autocomplete="off"
                >
                <button type="button" id="searchButton">Search</button>
            </div>

            <datalist id="pokemonList"></datalist>

            <div id="searchFeedback"></div>
        </section>

        <section id="resultSection" class="result-card hidden"></section>
    </main>

    <footer>
        <div class="footer-content">
            <hr>
            California State University Monterey Bay<br>
            School of Computing and Design<br>
            CST336 Internet Programming. 2026&copy; Yoon<br>
            <strong>Disclaimer:</strong> This webpage was created for academic purposes only.<br>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
